schema: paperclip/v1

# All agents run on the Claude Code (local) adapter using subscription OAuth.
# ANTHROPIC_API_KEY is deliberately NOT declared anywhere in this file — setting
# it would switch the adapter from subscription auth to API-key billing.
agents:
  executive-director:
    adapter:
      type: claude_local

  content-research-lead:
    adapter:
      type: claude_local
    inputs:
      env:
        OBSIDIAN_API_KEY:
          kind: secret
          requirement: optional

  social-media-manager:
    adapter:
      type: claude_local
    inputs:
      env:
        BLOTATO_API_KEY:
          kind: secret
          requirement: required

  community-engagement:
    adapter:
      type: claude_local
    inputs:
      env:
        BLOTATO_API_KEY:
          kind: secret
          requirement: optional

  video-producer:
    adapter:
      type: claude_local
    inputs:
      env:
        BLOTATO_API_KEY:
          kind: secret
          requirement: required

  growth-analyst:
    adapter:
      type: claude_local
    inputs:
      env:
        BLOTATO_API_KEY:
          kind: secret
          requirement: required

# All times America/Los_Angeles.
routines:
  monday-planning:
    triggers:
      - kind: schedule
        cronExpression: "0 7 * * 1"
        timezone: America/Los_Angeles

  weekly-theme:
    triggers:
      - kind: schedule
        cronExpression: "30 7 * * 1"
        timezone: America/Los_Angeles

  monday-post:
    triggers:
      - kind: schedule
        cronExpression: "0 9 * * 1"
        timezone: America/Los_Angeles

  tuesday-post:
    triggers:
      - kind: schedule
        cronExpression: "0 9 * * 2"
        timezone: America/Los_Angeles

  # Early start — the article plus images is the week's biggest single lift.
  wednesday-article:
    triggers:
      - kind: schedule
        cronExpression: "0 6 * * 3"
        timezone: America/Los_Angeles

  thursday-post:
    triggers:
      - kind: schedule
        cronExpression: "0 9 * * 4"
        timezone: America/Los_Angeles

  weekly-video:
    triggers:
      - kind: schedule
        cronExpression: "0 10 * * 2"
        timezone: America/Los_Angeles

  # Spread across the week so the 5+ comments are not batched into one session.
  weekly-engagement:
    triggers:
      - kind: schedule
        cronExpression: "0 11 * * 1,2,3,4,5"
        timezone: America/Los_Angeles

  linkedin-outreach:
    triggers:
      - kind: schedule
        cronExpression: "0 13 * * 1,3,5"
        timezone: America/Los_Angeles

  # Runs a week ahead so holiday content is queued before the day arrives.
  holiday-posts:
    triggers:
      - kind: schedule
        cronExpression: "0 14 * * 4"
        timezone: America/Los_Angeles

  weekly-analytics-review:
    triggers:
      - kind: schedule
        cronExpression: "0 14 * * 5"
        timezone: America/Los_Angeles

  monthly-membership-campaign:
    triggers:
      - kind: schedule
        cronExpression: "0 9 1 * *"
        timezone: America/Los_Angeles

  # Fires at the start of each quarter; the report itself runs as a 12-week
  # arc of child issues from there.
  quarterly-national-report:
    triggers:
      - kind: schedule
        cronExpression: "0 9 1 1,4,7,10 *"
        timezone: America/Los_Angeles
