<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avero Enterprise</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 310px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1a;
      background: #fff;
    }

    /* Header */
    .header {
      background: #F5C518;
      padding: 14px 16px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      font-size: 20px;
      line-height: 1;
    }

    .header-title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #1a1a1a;
    }

    .header-subtitle {
      font-size: 11px;
      color: #5a4800;
      margin-top: 1px;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 9px 16px;
      background: #f8f8f8;
      border-bottom: 1px solid #e8e8e8;
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9e9e9e;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .status-dot.connected { background: #2e7d32; }
    .status-dot.error     { background: #c62828; }
    .status-dot.checking  {
      background: #f5c518;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }

    .status-text {
      color: #444;
    }

    /* Content area */
    .content {
      padding: 14px 16px;
    }

    /* Form fields */
    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #666;
      margin-bottom: 5px;
    }

    .field input {
      display: block;
      width: 100%;
      border: 1px solid #d0d0d0;
      border-radius: 6px;
      padding: 7px 10px;
      font-size: 13px;
      font-family: inherit;
      color: #1a1a1a;
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus {
      border-color: #F5C518;
      box-shadow: 0 0 0 2px rgba(245, 197, 24, 0.2);
    }

    /* Save button */
    .btn-save {
      display: block;
      width: 100%;
      background: #F5C518;
      color: #1a1a1a;
      border: none;
      border-radius: 6px;
      padding: 9px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-save:hover { background: #e8b800; }
    .btn-save:active { transform: scale(0.98); }

    .save-feedback {
      text-align: center;
      font-size: 11px;
      color: #2e7d32;
      margin-top: 6px;
      min-height: 16px;
    }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid #e8e8e8;
      margin: 14px 0;
    }

    /* Quick actions */
    .quick-actions-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 8px;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
    }

    .btn-action {
      flex: 1;
      background: #fff;
      color: #333;
      border: 1px solid #c8c8c8;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      text-align: center;
    }

    .btn-action:hover {
      background: #f5f5f5;
      border-color: #999;
    }

    /* Footer */
    .footer {
      padding: 8px 16px 12px;
      text-align: center;
      font-size: 10px;
      color: #bbb;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div>
      <div class="header-title">&#11041; Avero Enterprise</div>
      <div class="header-subtitle">AI inside Gmail, Docs &amp; Sheets</div>
    </div>
  </div>

  <!-- Connection status -->
  <div class="status-bar">
    <div class="status-dot checking" id="status-dot"></div>
    <span class="status-text" id="status-text">Checking connection...</span>
  </div>

  <!-- Settings form -->
  <div class="content">
    <div class="field">
      <label for="server-url">Server URL</label>
      <input type="url" id="server-url" placeholder="http://localhost:3100" />
    </div>

    <div class="field">
      <label for="company-id">Company ID</label>
      <input type="text" id="company-id" placeholder="your-company-id" />
    </div>

    <div class="field">
      <label for="api-token">API Token <span style="font-weight:400;text-transform:none;color:#aaa">(optional)</span></label>
      <input type="password" id="api-token" placeholder="Bearer token for authenticated mode" />
    </div>

    <button class="btn-save" id="btn-save">Save Settings</button>
    <div class="save-feedback" id="save-feedback"></div>

    <hr class="divider" />

    <div class="quick-actions-title">Quick Actions</div>
    <div class="quick-actions">
      <button class="btn-action" id="btn-dashboard">Open Dashboard</button>
      <button class="btn-action" id="btn-toggle">Toggle Sidebar</button>
    </div>
  </div>

  <div class="footer">Avero Enterprise v1.0.0</div>

  <script src="popup.js"></script>
</body>
</html>
